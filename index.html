<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小八金融 - 在线股票查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        header h1 {
            font-size: 24px;
            color: #1a1a2e;
        }

        header p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        /* 输入区 */
        .input-section {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group select,
        .form-group input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            background: #fff;
        }

        .form-group select:focus,
        .form-group input[type="date"]:focus {
            outline: none;
            border-color: #4f6df5;
            box-shadow: 0 0 0 3px rgba(79, 109, 245, 0.1);
        }

        .btn-query {
            padding: 10px 32px;
            background: #4f6df5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-query:hover:not(:disabled) {
            background: #3b56d4;
        }

        .btn-query:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        /* 状态提示 */
        .status-bar {
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .status-bar .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #4f6df5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-info { color: #4f6df5; }
        .status-error { color: #e53e3e; }
        .status-success { color: #38a169; }
        .status-empty { color: #999; }

        /* 图表区 */
        .chart-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .chart-section h2 {
            font-size: 16px;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        #chart-container {
            width: 100%;
            height: 500px;
            position: relative;
        }

        #chart-container .chart-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #a0aec0;
            font-size: 15px;
        }

        /* 表格区 */
        .table-section {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .table-section h2 {
            font-size: 16px;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f8fafc;
            z-index: 1;
        }

        th {
            padding: 10px 12px;
            text-align: right;
            color: #64748b;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        th:first-child { text-align: left; }

        td {
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid #f1f5f9;
            color: #475569;
        }

        td:first-child { text-align: left; }

        tr:hover td {
            background: #f8fafc;
        }

        .pct-up { color: #e53e3e; }
        .pct-down { color: #38a169; }
        .pct-flat { color: #999; }

        .table-empty {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        /* 不支持提示 */
        .unsupported {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .input-row { flex-direction: column; }
            .form-group { width: 100%; }
            #chart-container { height: 350px; }
            header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 小八金融 - 在线股票查询</h1>
            <p>浏览器端 SQLite 查询 · K线图 · 成交量</p>
        </header>

        <!-- 不支持提示（JS 检测后显示） -->
        <div id="unsupported-msg" class="unsupported" style="display:none;">
            ⚠️ 您的浏览器不支持 WebAssembly 或 Web Worker，请使用现代浏览器（Chrome、Firefox、Safari、Edge）访问。
        </div>

        <!-- 输入区 -->
        <section class="input-section">
            <div class="input-row">
                <div class="form-group">
                    <label for="stock-select">股票代码</label>
                    <select id="stock-select">
                        <option value="">-- 请选择股票 --</option>
                        <option value="cn|000001">cn/000001 - 平安银行</option>
                        <option value="cn|000858">cn/000858 - 五粮液</option>
                        <option value="cn|600519">cn/600519 - 贵州茅台</option>
                        <option value="hk|00700">hk/00700 - 腾讯控股</option>
                        <option value="hk|09988">hk/09988 - 阿里巴巴</option>
                        <option value="us|105.AAPL">us/105.AAPL - 苹果</option>
                        <option value="us|105.GOOG">us/105.GOOG - 谷歌</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="start-date">开始日期</label>
                    <input type="date" id="start-date">
                </div>
                <div class="form-group">
                    <label for="end-date">结束日期</label>
                    <input type="date" id="end-date">
                </div>
                <button class="btn-query" id="query-btn">🔍 查询</button>
            </div>
        </section>

        <!-- 状态提示 -->
        <div class="status-bar" id="status-bar"></div>

        <!-- 图表区 -->
        <section class="chart-section">
            <h2>📈 K线图 + 成交量</h2>
            <div id="chart-container">
                <div class="chart-placeholder">请选择股票和日期范围后点击查询</div>
            </div>
        </section>

        <!-- 表格区 -->
        <section class="table-section">
            <h2>📋 数据明细</h2>
            <div class="table-wrapper">
                <table id="data-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>开盘价</th>
                            <th>收盘价</th>
                            <th>最高价</th>
                            <th>最低价</th>
                            <th>成交量</th>
                            <th>涨跌幅</th>
                        </tr>
                    </thead>
                    <tbody id="data-tbody"></tbody>
                </table>
                <div id="table-empty" class="table-empty">暂无数据，请执行查询</div>
            </div>
        </section>
    </div>

    <!-- LightweightCharts CDN (locked to v4.2.3 - v5+ API is incompatible) -->
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

    <!-- 主应用 -->
    <script src="app.js"></script>
</body>
</html>
